name: Check Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code_changed:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

      - name: Setup Rust
        if: steps.filter.outputs.code_changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc, aarch64-linux-android

      - name: Run Clippy (Windows)
        if: steps.filter.outputs.code_changed == 'true'
        run: cargo clippy --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run Clippy (Android)
        if: steps.filter.outputs.code_changed == 'true'
        run: cargo clippy --target aarch64-linux-android -- -D warnings
